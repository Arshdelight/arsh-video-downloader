name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # 引擎二进制不入库，构建时下载（runner 上 GitHub 全速）
      - name: Install engines (yt-dlp + ffmpeg)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          curl.exe -L -o src-tauri/binaries/yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe
          winget install --id Gyan.FFmpeg -e --accept-source-agreements --accept-package-agreements
          $ff = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Recurse -Filter ffmpeg.exe |
            Select-Object -First 1 -ExpandProperty FullName
          Copy-Item $ff src-tauri/binaries/ffmpeg.exe

      - name: Build parsehub sidecar
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File sidecar/build.ps1

      - name: Build + sign app
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npx tauri build --bundles nsis

      - name: Publish release + latest.json
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag.TrimStart('v')
          $sigFile = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe.sig" | Select-Object -First 1
          $exeFile = $sigFile.FullName -replace '\.sig$', ''
          $exeName = Split-Path $exeFile -Leaf
          $signature = (Get-Content $sigFile.FullName -Raw).Trim()
          $latest = [ordered]@{
            version   = $version
            notes     = "Release $tag"
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $signature
                url       = "https://github.com/${{ github.repository }}/releases/download/$tag/$exeName"
              }
            }
          }
          $latest | ConvertTo-Json -Depth 5 | Set-Content -Path latest.json -Encoding utf8
          gh release create $tag --title $tag --generate-notes --verify-tag
          gh release upload $tag $exeFile "$($sigFile.FullName)" latest.json --clobber
