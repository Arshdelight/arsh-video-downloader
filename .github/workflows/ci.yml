name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build 编译期校验 resources 存在；测试只放占位空文件
      - name: Stub engine binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries/parsehub-sidecar | Out-Null
          foreach ($f in 'yt-dlp.exe', 'ffmpeg.exe') {
            New-Item -ItemType File -Force -Path "src-tauri/binaries/$f" | Out-Null
          }
          New-Item -ItemType File -Force -Path src-tauri/binaries/parsehub-sidecar/parsehub-probe.exe | Out-Null

      # generate_context! embeds the frontend assets, so dist/ must exist
      - run: npm ci

      - run: npm run build:web

      - run: cargo check
        working-directory: src-tauri

  # sidecar 瘦身守卫：cv2/numpy/PIL 被打进产物时在 CI 就拦下
  sidecar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sidecar and verify size
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File sidecar/build.ps1
          Write-Host "===VERSIONS==="
          & sidecar/.venv/Scripts/python.exe -m pip list |
            Select-String -Pattern 'parsehub|PyInstaller|opencv|numpy|Pillow|Pillow'
          $size = (Get-ChildItem -Recurse src-tauri/binaries/parsehub-sidecar |
            Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "SIDECAR_SIZE_MB=$([math]::Round($size))"
          Write-Host "HAS_CV2=$(Test-Path src-tauri/binaries/parsehub-sidecar/_internal/cv2)"
          if ($size -gt 80) {
            Write-Host "::error::sidecar 超过 80MB，cv2/numpy/PIL 排除失效"
            exit 1
          }

      - name: Upload build graph diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-build-work
          path: sidecar/build-work/build/parsehub-probe/
