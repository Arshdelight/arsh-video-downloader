name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build 编译期校验 resources 存在；测试只放占位空文件
      - name: Stub engine binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries/parsehub-sidecar | Out-Null
          foreach ($f in 'yt-dlp.exe', 'ffmpeg.exe') {
            New-Item -ItemType File -Force -Path "src-tauri/binaries/$f" | Out-Null
          }
          New-Item -ItemType File -Force -Path src-tauri/binaries/parsehub-sidecar/parsehub-probe.exe | Out-Null

      # generate_context! embeds the frontend assets, so dist/ must exist
      - run: npm ci

      - run: npm run build:web

      - run: cargo check
        working-directory: src-tauri
